{% extends 'base.html' %}
{% block title %}Registrar produção · Gráfica EPA{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Registrar produção</h1><p>Registre equipe, horários, material perdido e quantidade produzida.</p></div><a href="{{ url_for('producao') }}" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Voltar</a></div>
<div class="panel form-panel"><h2 class="panel-title">Dados da produção</h2><p class="panel-description">A data é registrada automaticamente pela API.</p><form method="post" action="{{ url_for('nova_producao') }}"><div class="mb-3"><label for="fk_id_funcinario" class="form-label">Funcionário responsável</label><select class="form-select" id="fk_id_funcinario" name="fk_id_funcinario"><option value="">Não informar</option>{% for funcionario in funcionarios %}<option value="{{ funcionario.get('id_funcinario') }}">#{{ funcionario.get('id_funcinario') }} — {{ funcionario.get('nome') }}</option>{% endfor %}</select></div><div class="mb-3"><label for="fk_id_equipe" class="form-label">Equipe</label><select class="form-select" id="fk_id_equipe" name="fk_id_equipe"><option value="">Não informar</option>{% for equipe in equipes %}<option value="{{ equipe.get('id_equipe') }}">#{{ equipe.get('id_equipe') }} — {{ equipe.get('nome_equipe') }}</option>{% endfor %}</select></div><div class="row g-3"><div class="col-12 col-md-6"><label for="hora_inicio_rodagem" class="form-label">Horário de início</label><input class="form-control" id="hora_inicio_rodagem" name="hora_inicio_rodagem" type="time" required></div><div class="col-12 col-md-6"><label for="hora_fim_rodagem" class="form-label">Horário de término</label><input class="form-control" id="hora_fim_rodagem" name="hora_fim_rodagem" type="time" required></div></div><div class="row g-3 mt-1"><div class="col-12 col-md-6"><label for="material_perda" class="form-label">Material perdido</label><input class="form-control" id="material_perda" name="material_perda" maxlength="50" placeholder="Ex.: 3 folhas" required></div><div class="col-12 col-md-6"><label for="quantidade_produto" class="form-label">Quantidade produzida</label><input class="form-control" id="quantidade_produto" name="quantidade_produto" maxlength="50" placeholder="Ex.: 250" required></div></div><div class="mt-4"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-2"></i>Salvar produção</button><a href="{{ url_for('producao') }}" class="btn btn-outline-light ms-2">Cancelar</a></div></form></div>
{% endblock %}

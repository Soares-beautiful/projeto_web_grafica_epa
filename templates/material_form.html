{% extends 'base.html' %}
{% block title %}Novo material · Gráfica EPA{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Novo material</h1><p>Cadastre um insumo utilizado pela gráfica.</p></div><a href="{{ url_for('materiais') }}" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Voltar</a></div>
<div class="panel form-panel"><h2 class="panel-title">Dados do material</h2><p class="panel-description">O código é gerado automaticamente pela API.</p><form method="post" action="{{ url_for('novo_material') }}"><div class="mb-3"><label for="descricao_material" class="form-label">Descrição do material</label><input class="form-control" id="descricao_material" name="descricao_material" maxlength="100" placeholder="Ex.: Papel couché" required></div><div class="mb-3"><label for="unidade_medida" class="form-label">Unidade de medida</label><input class="form-control" id="unidade_medida" name="unidade_medida" maxlength="100" placeholder="Ex.: folha, litro, kg, unidade" required></div><div class="mb-4"><label for="fk_id_produto" class="form-label">Vincular a um produto (opcional)</label><select class="form-select" id="fk_id_produto" name="fk_id_produto"><option value="">Não vincular agora</option>{% for produto in produtos %}<option value="{{ produto.get('id_produto') }}">#{{ produto.get('id_produto') }} — {{ produto.get('descricao') }}</option>{% endfor %}</select></div><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-2"></i>Salvar material</button><a href="{{ url_for('materiais') }}" class="btn btn-outline-light ms-2">Cancelar</a></form></div>
{% endblock %}

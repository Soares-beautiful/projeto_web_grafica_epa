{% extends 'base.html' %}
{% block title %}Novo turno · Gráfica EPA{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Novo turno</h1><p>Defina a equipe e seus horários de trabalho.</p></div><a href="{{ url_for('turnos') }}" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Voltar</a></div>
<div class="panel form-panel"><h2 class="panel-title">Dados do turno</h2><p class="panel-description">O nome da equipe é guardado junto aos horários.</p><form method="post" action="{{ url_for('novo_turno') }}"><div class="mb-3"><label for="fk_id_equipe" class="form-label">Equipe cadastrada (opcional)</label><select class="form-select" id="fk_id_equipe" name="fk_id_equipe"><option value="">Sem vínculo com uma equipe cadastrada</option>{% for equipe in equipes %}<option value="{{ equipe.get('id_equipe') }}">#{{ equipe.get('id_equipe') }} — {{ equipe.get('nome_equipe') }}</option>{% endfor %}</select></div><div class="mb-3"><label for="nome_equipe" class="form-label">Nome da equipe</label><input class="form-control" id="nome_equipe" name="nome_equipe" maxlength="100" placeholder="Digite o nome da equipe" required></div><div class="row g-3"><div class="col-12 col-md-6"><label for="hora_inicio" class="form-label">Horário de início</label><input class="form-control" id="hora_inicio" name="hora_inicio" type="time" required></div><div class="col-12 col-md-6"><label for="hora_fim" class="form-label">Horário de término</label><input class="form-control" id="hora_fim" name="hora_fim" type="time" required></div></div><div class="mt-4"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-2"></i>Salvar turno</button><a href="{{ url_for('turnos') }}" class="btn btn-outline-light ms-2">Cancelar</a></div></form></div>
{% endblock %}
